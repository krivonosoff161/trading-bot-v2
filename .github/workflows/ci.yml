name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test ubuntu-latest / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        # actions/setup-python v5.6.0
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Check supply-chain policy
        run: python scripts/ci/check_supply_chain_policy.py

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-ci.txt

      - name: Check canonical Python quality
        run: |
          python -m ruff check .
          python -m mypy \
            --explicit-package-bases \
            --follow-imports=skip \
            --ignore-missing-imports \
            src/research_lab \
            scripts/strategy_lab \
            scripts/research_control_center.py

      - name: Check whitespace
        run: git diff --check

      - name: Check tracked private/runtime artifacts
        run: python scripts/ci/check_tracked_artifacts.py

      - name: Check public documentation and entrypoint catalog
        run: |
          python scripts/ci/check_public_docs.py
          python scripts/ci/check_trading_portfolio_docs.py

      - name: Run non-live tests
        env:
          AUTO_TRADE: "false"
        run: python -m pytest
