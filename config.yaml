trading:
  leverage: 5
  poll_interval: 10     # seconds between each bot tick

# Pairs to include in "Реальные сделки" journal tab.
# Bot pairs (BTC/ETH/SOL/DOGE/XRP) are always included automatically.
# Add here any pairs you trade manually that are NOT in the bot list.
real_trades_symbols: ["POPCAT-USDT"]
# Add here any pairs you trade manually that are NOT in the bot list (BTC/ETH/SOL/DOGE/XRP).

strategy:
  ema_fast: 20
  ema_slow: 50
  adx_period: 9
  slope_min: 35
  hold_fast_minutes: 90
  hold_drift_minutes: 75
  hold_trending_fast_minutes: 120
  trending_require_fvg: false
  min_vol_ratio_trending: 1.5

# pump_engine: DEPRECATED — used by ws_pump_engine_v1/v2 (archived to scripts/archive/).
# Production pump engine reads pump_orchestrator: section below.
# Kept for reference only — changing these values has NO effect on running processes.

pump_orchestrator:
  # Pool
  max_main_slots: 2            # макс пар в MAIN пуле одновременно
  universe_poll_sec: 1         # частота проверки active_universe.json (mtime watcher)

  # Entry
  vol_mult: 2.0                # мин vol_ratio для входа (vs 10-bar baseline)
  price_pct: 1.5               # мин price_move % на сигнальной свече
  min_usd_vol: 30000           # мин dollar_vol на свече
  pump_phase_max_pct: 3.0      # не входить если цена уже >3% от baseline
  alert_cooldown_sec: 300      # cooldown между сигналами на одной паре (5 мин — skip retracement)
  min_pool_dwell_min: 30       # мин время удержания пары в pool после добавления

  # Position sizing
  position_usd: 100.0
  fee_rt_pct: 0.10
  sl_atr_mult: 1.5
  tp_atr_mult: 2.5
  paper_max_hold_min: 9999

  # Counter-trend
  main_sl_to_counter: 99       # counter mode отключён
  counter_sl_to_ban: 1         # SL в counter → 24h бан

  # Circuit breaker
  cb_cooldown_sl: 3            # суммарных SL подряд → cooldown
  cb_cooldown_min: 30          # минут cooldown
  cb_daily_loss_pct: 4.0       # дневной убыток % → halt all
  cb_daily_halt_cooldown_min: 120  # минут до авто-сброса daily halt (0 = только при рестарте)
  session_ban_sl_no_tp: 3      # 3 SL без TP -> бан до конца UTC-дня

  # Entry quality filters
  confirmation_reversal_max_pct: 0.5   # макс откат на свече подтверждения (%)
  min_tp_pct: 1.0                      # минимальный TP в % (не зависит от ATR)
  pool_dead_vol_candles: 3             # свечей без объёма → выброс из пула

  # Telegram extra chats (group/channel IDs for pump notifications)
  extra_notify_chats: [-1003352142986]

  # Entry confirmation
  pending_ttl_sec: 120              # max seconds to wait for confirm candle after screener signal
  confirm_vol_min_ratio: 0.8        # confirm candle vol >= baseline * this
  stagnation_vol_min: 2.0           # vol_spike threshold for stagnation check (Path B)
  stagnation_price_max_pct: 0.5     # price_move below this = stagnation (high vol, no move)

  # Pool management
  eviction_vol_multiplier: 1.5      # dead vol: candles below baseline * this → evict pair
  ban_hours: 24                     # hours a pair stays banned after counter SL streak

  # Technical
  heartbeat_interval: 30

screener_live:
  vol_spike_min: 2.0
  price_move_min_pct: 1.0
  inactivity_bars: 3
  min_vol_24h_usd: 1000000
  warmup_bars: 15

main_screener:
  top_n_pairs: 24
  universe_refresh_hours: 8
  cooldown_minutes: 60
  warmup_bars: 20
  prefilter_vol_ratio_min: 1.0
  prefilter_adx_min: 10

bb_fade:
  top_n_pairs:            24
  universe_refresh_hours:  8
  bb_period:              20
  bb_std:                2.0
  sl_mult:               0.5    # SL = band_edge + band_width * sl_mult
  min_width_pct:         2.0    # skip if BB width < 2% of price
  max_vol_ratio:         1.5    # skip if vol spike (breakout, not reversion)
  rsi_period:             14
  rsi_sell_max:           60    # skip SELL if RSI > 60 (momentum breakout)
  rsi_buy_min:            40    # skip BUY  if RSI < 40 (downtrend impulse)
  confirm_bars:            3    # max 5m bars to wait for wick rejection
  cooldown_min:           30    # min between signals per pair
  hold_min:               80    # max hold time in minutes
  adx_period:              9
  adx_trending_min:       22    # 1H ADX >= this = trending = skip
  di_spread_min:          10    # 1H DI spread >= this = trending = skip
  skip_asia_utc:        true    # skip 00:00-08:00 UTC (Asia underperforms)
  min_rr_ratio:         0.5     # SKIP if TP_dist < SL_dist × this (anti-TRUTH-incident)
