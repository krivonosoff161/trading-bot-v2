trading:
  leverage: 5
  poll_interval: 10     # seconds between each bot tick

# Pairs to include in "Реальные сделки" journal tab.
# Bot pairs (BTC/ETH/SOL/DOGE/XRP) are always included automatically.
# Add here any pairs you trade manually that are NOT in the bot list.
real_trades_symbols: ["POPCAT-USDT"]
# Add here any pairs you trade manually that are NOT in the bot list (BTC/ETH/SOL/DOGE/XRP).

strategy:
  ema_fast: 20
  ema_slow: 50
  adx_period: 9
  slope_min: 35
  hold_fast_minutes: 90
  hold_drift_minutes: 75
  hold_trending_fast_minutes: 120
  trending_require_fvg: false
  min_vol_ratio_trending: 1.5

# pump_engine: DEPRECATED — used by ws_pump_engine_v1/v2 (archived to scripts/archive/).
# Production pump engine reads pump_orchestrator: section below.
# Kept for reference only — changing these values has NO effect on running processes.

pump_orchestrator:
  # Pool
  max_main_slots: 2            # макс пар в MAIN пуле одновременно
  universe_poll_sec: 1         # частота проверки active_universe.json (mtime watcher)

  # Entry
  vol_mult: 2.0                # мин vol_ratio для входа (vs 10-bar baseline)
  price_pct: 1.5               # мин price_move % на сигнальной свече
  min_usd_vol: 30000           # мин dollar_vol на свече
  pump_phase_max_pct: 3.0      # не входить если цена уже >3% от baseline
  alert_cooldown_sec: 300      # cooldown между сигналами на одной паре (5 мин — skip retracement)
  min_pool_dwell_min: 30       # мин время удержания пары в pool после добавления

  # Position sizing
  position_usd: 100.0
  fee_rt_pct: 0.10
  sl_atr_mult: 1.5
  tp_atr_mult: 2.5
  paper_max_hold_min: 9999

  # Counter-trend
  main_sl_to_counter: 99       # counter mode отключён
  counter_sl_to_ban: 1         # SL в counter → 24h бан

  # Circuit breaker
  cb_cooldown_sl: 3            # суммарных SL подряд → cooldown
  cb_cooldown_min: 30          # минут cooldown
  cb_daily_loss_pct: 4.0       # дневной убыток % → halt all
  cb_daily_halt_cooldown_min: 120  # минут до авто-сброса daily halt (0 = только при рестарте)
  session_ban_sl_no_tp: 2      # GPT 18.05 (Sim7 +4.75pp): 2 SL без TP -> бан до конца UTC-дня (было 3)

  # Entry quality filters
  confirmation_reversal_max_pct: 0.5   # макс откат на свече подтверждения (%)
  min_tp_pct: 1.0                      # минимальный TP в % (не зависит от ATR)
  pool_dead_vol_candles: 3             # свечей без объёма → выброс из пула

  # Telegram extra chats — set actual IDs via PUMP_CHAT_ID in .env (not committed)
  extra_notify_chats: []
  notify_min_interval_sec: 2.0   # min seconds between notifications to same chat (0 = no throttle)

  # Entry confirmation
  pending_ttl_sec: 120              # max seconds to wait for confirm candle after screener signal
  confirm_vol_min_ratio: 0.8        # confirm candle vol >= baseline * this
  stagnation_vol_min: 2.0           # vol_spike threshold for stagnation check (Path B)
  stagnation_price_max_pct: 0.5     # price_move below this = stagnation (high vol, no move)
  enable_path_b: false              # GPT 18.05: Path B обходит confirmation, 3/3 SL — отключен по умолчанию

  # Breakeven trail (GPT 18.05: +21.56 п.п. на 16-18.05 backtest)
  breakeven_trail_enabled: true     # SL → entry когда MFE достигает trigger
  breakeven_trigger_r: 1.0          # активация когда MFE >= 1R (R-кратное от SL distance)

  # Pair risk overrides (GPT 18.05 research, Sim8 +16.27pp)
  # Пары без tape coverage и стабильно убыточные → hard block на этапе signal
  # mode: "block" → entry signal skipped (логируется как PAIR_BLOCKED)
  # Расширение схемы (size_mult, max_trades_per_day) — после majors-vs-alts research
  pair_risk_overrides:
    APR-USDT-SWAP:   { mode: block }    # n=5, net=-6.90%, no tape on E:
    RIVER-USDT-SWAP: { mode: block }    # n=3, net=-4.23%, no tape on E:
    LAB-USDT-SWAP:   { mode: block }    # n=3, net=-3.47%, no tape on E:

  # Pool management
  eviction_vol_multiplier: 1.5      # dead vol: candles below baseline * this → evict pair
  ban_hours: 24                     # hours a pair stays banned after counter SL streak

  # Technical
  heartbeat_interval: 30

screener_live:
  vol_spike_min: 2.0
  price_move_min_pct: 1.0
  inactivity_bars: 3
  min_vol_24h_usd: 1000000
  warmup_bars: 15

main_screener:
  top_n_pairs: 24
  universe_refresh_hours: 8
  cooldown_minutes: 60
  warmup_bars: 20
  prefilter_vol_ratio_min: 1.0
  prefilter_adx_min: 10
  context_gate:
    skip_asia_trending: true   # Asia 00-05 UTC + regime=TRENDING -> skip (WR=33%, research 19.05)
    asia_utc_end: 6            # hours 0-5 treated as Asia (00:00-05:59 UTC)

smart_pump:
  # Detection
  explosion_pct: 0.8          # min |price_change_1m_pct| for explosive candle
  vol_mult: 2.0               # min vol_ratio vs 15-bar baseline
  baseline_bars: 15           # bars for volume baseline

  # Eligible pairs (reversal WR >= 53%, research 19.05)
  eligible_pairs:
    - BILL-USDT-SWAP          # n=895, WR=54.5%
    - JELLYJELLY-USDT-SWAP    # n=36,  WR=55.6%
    - NOT-USDT-SWAP           # n=19,  WR=63.2%

  # Intra-candle entry (Variant A: confirm=0)
  early_entry_enabled: true
  early_trigger_pct: 0.5      # price move from candle open, pct
  early_trigger_sec: 20       # max seconds from candle open

  # Risk management (paper)
  sl_pct: 0.8                 # initial SL, pct from entry
  tp_pct: 1.5                 # TP, pct from entry
  max_hold_min: 15            # time exit

  # Dynamic SL promotion
  be_trigger_pct: 0.5         # after MFE >= 0.5% -> SL to BE
  lock_trigger_pct: 0.7       # after MFE >= 0.7% -> SL to BE+0.2%
  lock_profit_pct: 0.2        # locked profit at lock_trigger

  # Limits
  max_concurrent: 2           # max concurrent paper positions
  cooldown_sec: 120           # per-pair cooldown after exit

  # Notifications — set actual IDs via PUMP_CHAT_ID in .env (not committed)
  extra_notify_chats: []

  # System
  universe_poll_sec: 1
  heartbeat_interval: 30
  warmup_bars: 20

impulse_pump:
  enabled: true
  auto_trade: false
  paper: true
  pairs:
    - BSB-USDT-SWAP
    - EDEN-USDT-SWAP
    - RLS-USDT-SWAP
    - CHZ-USDT-SWAP
    - SPACE-USDT-SWAP
    - NOT-USDT-SWAP
    - TURBO-USDT-SWAP
    - BOME-USDT-SWAP
  body_ratio_min: 2.0
  vol_ratio_min: 2.0
  trigger_pct: 1.0
  trigger_window_sec: 10
  entry_slippage_pct: 0.03
  fee_pct: 0.20
  stop_buffer_pct: 0.10
  structure_k: 2
  max_hold_min: 60
  max_concurrent: 2
  cooldown_sec: 300
  position_usd: 100.0
  warmup_bars: 40
  heartbeat_interval: 30
  notify_min_interval_sec: 2.0
  vol_tier: volatile_alt
  extra_notify_chats: []

main_impulse:
  enabled: false
  auto_trade: false
  paper: true
  pairs:
    - BSB-USDT-SWAP
    - EDEN-USDT-SWAP
    - RLS-USDT-SWAP
    - CHZ-USDT-SWAP
    - SPACE-USDT-SWAP
    - NOT-USDT-SWAP
    - TURBO-USDT-SWAP
    - BOME-USDT-SWAP
  body_ratio_min: 2.0
  vol_ratio_min: 2.0
  trigger_pct: 1.0
  trigger_window_sec: 10
  entry_slippage_pct: 0.03
  exit_slippage_pct: 0.03
  fee_pct: 0.20
  stop_buffer_pct: 0.10
  structure_k: 2
  exit_mode: ride
  scaled_tp_body_mult: 1.0
  scaled_tp_min_pct: 0.8
  be_at_R: 1.0
  max_hold_min: 60
  max_concurrent: 2
  cooldown_sec: 300
  warmup_bars: 40
  heartbeat_interval: 30
  notify_min_interval_sec: 2.0
  extra_notify_chats: []

bb_fade:
  top_n_pairs:            24
  universe_refresh_hours:  8
  bb_period:              20
  bb_std:                2.0
  sl_mult:               0.5    # SL = band_edge + band_width * sl_mult
  min_width_pct:         2.0    # skip if BB width < 2% of price
  max_vol_ratio:         1.5    # skip if vol spike (breakout, not reversion)
  rsi_period:             14
  rsi_sell_max:           60    # skip SELL if RSI > 60 (momentum breakout)
  rsi_buy_min:            40    # skip BUY  if RSI < 40 (downtrend impulse)
  confirm_bars:            3    # max 5m bars to wait for wick rejection
  cooldown_min:           30    # min between signals per pair
  hold_min:               80    # max hold time in minutes
  adx_period:              9
  adx_trending_min:       22    # 1H ADX >= this = trending = skip
  di_spread_min:          10    # 1H DI spread >= this = trending = skip
  skip_asia_utc:        true    # skip 00:00-08:00 UTC (Asia underperforms)
  min_rr_ratio:         0.5     # SKIP if TP_dist < SL_dist × this (anti-TRUTH-incident)
