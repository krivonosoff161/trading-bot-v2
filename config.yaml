trading:
  leverage: 5
  poll_interval: 10     # seconds between each bot tick

  symbols:
    - id: BTC-USDT
      order_size: "1"           # contracts
      atr_sl_multiplier: 1.5   # SL = ATR(1m) * multiplier
      atr_tp_multiplier: 2.25  # TP = ATR(1m) * multiplier (R:R 1:1.5)
      min_sl_percent: 0.003    # SL minimum 0.3% (mark price drift protection)
      rsi_oversold: 35
      rsi_overbought: 65

    - id: SOL-USDT
      order_size: "1"
      atr_sl_multiplier: 2.5
      atr_tp_multiplier: 3.75
      min_sl_percent: 0.005    # SOL is more volatile, wider buffer
      rsi_oversold: 30
      rsi_overbought: 70

    - id: ETH-USDT
      order_size: "1"
      atr_sl_multiplier: 1.5
      atr_tp_multiplier: 2.25
      min_sl_percent: 0.003    # ETH is closer to BTC than alts
      rsi_oversold: 35
      rsi_overbought: 65

    - id: XRP-USDT
      order_size: "1"
      atr_sl_multiplier: 2.5
      atr_tp_multiplier: 3.75
      min_sl_percent: 0.006    # XRP is noisier, keep wider minimum stop
      rsi_oversold: 28
      rsi_overbought: 72

strategy:
  adx_threshold: 22    # ADX(5m) regime threshold
  reversal_profit_atr: 0.5   # close reversal only after >= 0.5 ATR in profit
  # EMA(8/21) crossover on 1m — hardcoded in signal.py
  # RSI(3) pullback filter — hardcoded in signal.py
