trading:
  leverage: 5
  poll_interval: 10     # seconds between each bot tick

# Pairs to include in "Реальные сделки" journal tab.
# Bot pairs (BTC/ETH/SOL/DOGE/XRP) are always included automatically.
# Add here any pairs you trade manually that are NOT in the bot list.
real_trades_symbols: ["POPCAT-USDT"]
# Add here any pairs you trade manually that are NOT in the bot list (BTC/ETH/SOL/DOGE/XRP).

strategy:
  ema_fast: 20
  ema_slow: 50
  adx_period: 9
  slope_min: 35
  hold_fast_minutes: 90
  hold_drift_minutes: 75
  hold_trending_fast_minutes: 120
  trending_require_fvg: true

pump_engine:
  # Detection
  vol_mult: 1.5
  price_pct: 1.2
  lookback: 15
  alert_cooldown_sec: 120

  # Filters
  min_usd_vol: 30000
  active_hours: []  # no restriction — pumps happen 24/7
  vol_sustain_bars: 3
  vol_sustain_ratio: 0.8

  # Universe
  max_pairs: 14
  min_market_vol_24h: 10000000
  universe_refresh_hours: 1

  # Paper trading
  paper_tp_pct: 1.5
  paper_sl_pct: 0.8
  sl_atr_mult: 1.5
  tp_atr_mult: 2.5
  paper_max_hold_min: 9999  # effectively disabled — SL/TP are the only exits
  paper_position_usd: 100.0
  paper_balance_usd: 1000.0
  max_open_positions: 3
  fee_rt_pct: 0.10

  # Telegram
  telegram_enabled: false
  # Tokens in .env: PUMP_TG_TOKEN, PUMP_TG_CHAT_ID

  # Technical
  heartbeat_interval: 30
  state_ttl_min: 10
  reconnect_delays: [2, 4, 8, 16, 32, 60]

  # Circuit breaker (B.5.1)
  cb_max_consecutive_sl: 3    # SL подряд → cooldown
  cb_cooldown_min: 30         # минут cooldown после серии потерь
  cb_hourly_sl_limit: 3       # SL за час → session blacklist
  cb_daily_loss_pct: 5.0      # дневной убыток % → halt all

pump_orchestrator:
  # Pool
  max_main_slots: 4            # макс пар в MAIN пуле одновременно
  universe_poll_sec: 1         # частота проверки active_universe.json (mtime watcher)

  # Entry
  vol_mult: 1.5                # мин vol_ratio для входа (vs 10-bar baseline)
  price_pct: 1.2               # мин price_move % на сигнальной свече
  min_usd_vol: 30000           # мин dollar_vol на свече
  pump_phase_max_pct: 5.0      # не входить если цена уже >5% от baseline
  alert_cooldown_sec: 120      # cooldown между сигналами на одной паре

  # Position sizing
  position_usd: 100.0
  fee_rt_pct: 0.10
  sl_atr_mult: 1.5
  tp_atr_mult: 2.5
  paper_max_hold_min: 9999

  # Counter-trend
  main_sl_to_counter: 2        # SL подряд в main → переход в counter
  counter_sl_to_ban: 2         # SL подряд в counter → 24h бан

  # Circuit breaker
  cb_cooldown_sl: 3            # суммарных SL подряд → cooldown
  cb_cooldown_min: 30          # минут cooldown
  cb_daily_loss_pct: 5.0       # дневной убыток % → halt all

  # Technical
  heartbeat_interval: 30

screener_live:
  vol_spike_min: 2.0
  price_move_min_pct: 1.0
  inactivity_bars: 3
  min_vol_24h_usd: 1000000
  warmup_bars: 15

main_screener:
  top_n_pairs: 24
  universe_refresh_hours: 8
  cooldown_minutes: 60
  warmup_bars: 20
  prefilter_vol_ratio_min: 1.0
  prefilter_adx_min: 10
