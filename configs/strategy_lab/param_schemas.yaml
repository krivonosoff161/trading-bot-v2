version: 1
owner: strategy_registry
description: >
  Parameter validation policy layered over src.research_lab.strategy_registry.
  This file is not a second strategy catalog: allowed parameter keys and defaults
  are read from the registry. The policy below only defines units, executable
  paper gates, and conservative generic ranges.

units:
  stop_pct: percent_points
  take_pct: percent_points
  threshold_pct: percent_points
  move_pct: percent_points
  max_range_pct: percent_points

executable:
  required_keys:
    - hold_bars
    - stop_pct
    - take_pct
  min_reward_risk: 2.0

ranges:
  hold_bars:
    type: int
    min: 1
    max: 240
  stop_pct:
    type: number
    min: 0.1
    max: 50.0
  take_pct:
    type: number
    min: 0.2
    max: 200.0

# Per-timeframe holding-horizon bounds on hold_bars (1 bar = the timeframe). Keeps a
# proposal's hold sane for its scale: 15m = minutes-to-~2 days, 1h = hours-to-days,
# 4h = days, 1d = days-to-weeks. A hold outside the band is rejected (wrong_horizon).
horizon:
  "15m": {min_hold_bars: 1, max_hold_bars: 192}   # up to ~48h
  "1h":  {min_hold_bars: 1, max_hold_bars: 168}   # up to ~7 days
  "4h":  {min_hold_bars: 1, max_hold_bars: 60}    # up to ~10 days
  "1d":  {min_hold_bars: 1, max_hold_bars: 30}    # up to ~30 days

fallback_ranges:
  int:
    min: 0
    max_mult: 4
    min_max: 10
  number:
    min: 0.0
    max_mult: 4
    min_max: 1.0
