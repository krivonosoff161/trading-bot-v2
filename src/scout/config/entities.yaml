  - {sym: SHIB, layer: 2, okx_inst: SHIB-USDT-SWAP, baseline: BTC-USDT-SWAP, strong: ["shiba inu", shiba], weak: [shib]}
  - {sym: WIF, layer: 2, okx_inst: WIF-USDT-SWAP, baseline: BTC-USDT-SWAP, strong: ["dogwifhat"], weak: [wif]}
  - {sym: BONK, layer: 2, okx_inst: BONK-USDT-SWAP, baseline: BTC-USDT-SWAP, strong: [bonk], weak: []}
  - {sym: PUMP, layer: 2, okx_inst: PUMP-USDT-SWAP, baseline: BTC-USDT-SWAP, strong: ["pump.fun", pumpfun], weak: [pump]}
  # --- слой 5: акции + pre-IPO перпы (на OKX), baseline QQQ ---
  - {sym: NVDA, layer: 5, okx_inst: NVDA-USDT-SWAP, baseline: QQQ-USDT-SWAP, strong: [nvidia, nvda], weak: []}
  - {sym: TSLA, layer: 5, okx_inst: TSLA-USDT-SWAP, baseline: QQQ-USDT-SWAP, strong: [tesla, tsla], weak: []}
  - {sym: MSTR, layer: 5, okx_inst: MSTR-USDT-SWAP, baseline: QQQ-USDT-SWAP, strong: [microstrategy, "strategy inc", mstr], weak: []}
  - {sym: COIN, layer: 5, okx_inst: COIN-USDT-SWAP, baseline: QQQ-USDT-SWAP, strong: [coinbase], weak: []}
  - {sym: OPENAI, layer: 5, okx_inst: OPENAI-USDT-SWAP, baseline: QQQ-USDT-SWAP, strong: [openai], weak: []}
  - {sym: ANTHROPIC, layer: 5, okx_inst: ANTHROPIC-USDT-SWAP, baseline: QQQ-USDT-SWAP, strong: [anthropic], weak: []}
  - {sym: SPACEX, layer: 5, okx_inst: SPACEX-USDT-SWAP, baseline: QQQ-USDT-SWAP, strong: [spacex], weak: []}
  # --- Этап 4: провод слоёв 3-5 по ЗАГОЛОВКАМ (структура) ---
  # - {sym: NVDA, layer: 5, okx_inst: NVDA-USDT-SWAP, baseline: QQQ-USDT-SWAP, strong: [nvidia, nvda], weak: []}

# Классификация ИНСТРУМЕНТА → слой (для новых листингов открытой вселенной, где актив заранее не известен).
# Базовый символ инструмента в списке → его слой; иначе крипта (слой 2 альт; мажоры из assets = слой 1).
layer_map:
  3: [XAU, XAG, XPT, XPD]                     # металлы
  4: [CL]                                     # ресурсы (нефть)
  5: [NVDA, AMD, AVGO, TSM, INTC, MU, QCOM, ARM, MRVL, MSFT, GOOGL, GOOG, META, AMZN, AAPL,
      TSLA, NFLX, COIN, MSTR, HOOD, PLTR, QQQ, SPY, CRWD, NOW, ORCL, ASML, ADBE, HPE, ASTS,
      AVUV, OPENAI, ANTHROPIC, SPACEX]        # акции + pre-IPO перпы

# Якорь baseline по слою (excess vs index, не хардкод BTC). Off-OKX (металлы/нефть) → manual.
baseline_by_layer:
  1: BTC-USDT-SWAP
  2: BTC-USDT-SWAP
  5: QQQ-USDT-SWAP
