# event_taxonomy.yaml — материальность (триггер vs шум) по слою. Главный бюджетный gate ДО LLM.
# score_materiality(headline, layer): negative-genre → дроп сразу; иначе positive per-layer термин
# даёт family+score; нет термина → дроп (no_material_term). Пороги — здесь, не в коде.

materiality:
  threshold_llm: 0.5        # >= → кандидат в LLM; < → дроп
  base_score: 0.6           # вес попадания в материальную family

dedup:
  fuzzy_min: 88             # token_set_ratio порог near-duplicate заголовков одного актива
  window_hours: 48          # окно «одно событие» (дальше — считаем разными)

limits:
  max_cards_per_asset_per_run: 1   # не флудить одним активом (был кейс 4 BTC NO_GO подряд)

# Negative-genre: заведомый шум (обзоры/мнения/прогнозы цены/гайды/реклама) → дроп noise_genre.
noise_genres:
  - price analysis
  - price prediction
  - prediction
  - reasons to
  - how to
  - what to know
  - things to
  - weekly recap
  - recap
  - sponsored
  - opinion
  - explained
  - guide
  - "top 5"
  - "top 10"
  - here's why
  - heres why
  # --- ценовая болтовня/прогнозы (не событие, а мнение) ---
  - fair value
  - price target
  - could hit
  - could reach
  - may hit
  - may reach
  - could see
  - eyes $
  - sees $
  - target after
  - key support
  - key resistance
  - what's next
  - whats next
  - here's what
  - heres what
  - copying
  - fractal
  - pattern suggests
  - outlook
  - scenario
  - is it time

# Positive: материальные event-families по слою (термин в заголовке → family).
layers:
  1:   # крипта-история (BTC/ETH мажоры)
    etf_flow:   [etf, "spot etf", inflow, outflow, "net flow"]
    regulation: [sec, cftc, lawsuit, "court", ban, sanction, ruling, regulation]
    exploit:    [hack, exploit, breach, drained, "stolen"]
    macro:      [fed, fomc, "rate cut", "rate hike", cpi, inflation, jobs]
    listing:    [listing, lists, delist, delisting]
    flows:      [whale, "exchange outflow", "exchange inflow", reserves]
  2:   # альты/мемы (структура; провод on-chain — Этап 4)
    listing:    [listing, lists, delist]
    unlock:     [unlock, vesting, "token release"]
    exploit:    [rug, hack, exploit, honeypot, scam]
    launch:     [launch, mainnet, airdrop]
  3:   # металлы/макро (золото/серебро/медь/платина)
    macro:     [fed, fomc, "rate cut", "rate hike", cpi, inflation, dollar, "jobs report", powell, "central bank"]
    supply:    [mine, smelter, inventory, output, production, strike]
    demand:    ["china demand", reserves, "safe haven", etf]
    trade:     [tariff, duty, sanction, ban, export, embargo]
  4:   # нефть/газ/энергия
    opec:      [opec, quota, "output cut", "production cut", "production hike", "spare capacity"]
    inventory: [eia, "crude inventory", stockpile, draw, build]
    geo:       [strait, hormuz, sanction, strike, war, attack, embargo, drone]
    supply:    [pipeline, refinery, outage, disruption, "supply cut"]
  5:   # акции/pre-IPO перпы
    earnings:  [earnings, eps, guidance, beats, misses, revenue]
    filing:    ["8-k", "s-1", "424b", "sec filing", "10-k", "10-q", prospectus, "form 4"]
    ma:        [merger, acquisition, antitrust, buyout, takeover, stake]
    product:   [launches, unveils, recall, approval, "data center", chip]
    pre_ipo_market_mechanics: [
      "ipo", "pre-ipo", "public debut", "market debut", "trading debut", "nasdaq debut",
      "historic debut", "largest ipo", "priced", "prices", "allocation", "allocations",
      "underwriter", "tokenized", "tokenised", "xstocks", "spcx", "synthetic price",
      "premium", "derivative", "derivatives", "refund", "scrap", "cancel"
    ]
