# source_registry.yaml — КАРТА источников (единая правда «что куда»).
# Поля: source_class · lead_class(LEADING/COINCIDENT/LAGGING) · trust · layers(какие кормит) ·
#       phase_prior(realized/expected/mixed — приор было/будет) · keyless · enabled.
# Онбординг-поля (эксперимент «один источник на слой», 11.06.2026):
#   onboarding_status: candidate(на замере 24-48ч) / live / disabled / rejected / needs_key / needs_provider
#   expected_body: direct_body / google_wrapper / api / manual_csv — что ждём от extract-стадии
#   quality_notes / rate_limit_notes — на что смотреть в source_onboarding_report.
# Роллбэк любого источника = enabled: false (следующий проход сканера его не читает).
# lead_class — поле данных; правило в коде: GO+side только если ≥1 LEADING.
# trust: official > primary > wire > aggregator > tg_alpha > tg_noise.
# phase_prior: expected=календарь(будет) · realized=факт/филинг(произошло) · mixed=новостная лента.
# Источник может кормить НЕСКОЛЬКО слоёв; слой кормят НЕСКОЛЬКО источников. Включаем по одному (enabled).

sources:
  # ── АКТИВНЫЕ ──────────────────────────────────────────────────────────────
  cointelegraph:
    url: https://cointelegraph.com/rss
    source_class: rss
    lead_class: LAGGING
    trust: wire
    phase_prior: mixed
    keyless: true
    layers: [1, 2]
    enabled: true

  okx_listings:                # новые листинги OKX (произошло), keyless
    source_class: ws
    lead_class: LEADING
    trust: official
    phase_prior: realized
    keyless: true
    layers: [1, 2, 5]          # слой по инструменту (классификатор)
    enabled: true

  # ── ПРОИЗОШЛО (realized) — добавляем по одному, keyless сначала ───────────
  decrypt:
    url: https://decrypt.co/feed
    source_class: rss
    lead_class: LAGGING
    trust: wire
    phase_prior: mixed
    keyless: true
    layers: [1, 2]
    enabled: true

  google_news_crypto:
    url: "https://news.google.com/rss/search?q=crypto+OR+bitcoin+OR+altcoin+OR+ethereum&hl=en-US&gl=US&ceid=US:en"
    source_class: rss
    lead_class: LAGGING
    trust: aggregator
    phase_prior: mixed
    max_age_hours: 72
    keyless: true
    layers: [1, 2]
    enabled: true

  # ── L3 металлы / L4 энергия / L5 акции — keyless Google News (наполняют тёмные слои) ──
  google_news_metals:
    url: "https://news.google.com/rss/search?q=gold+price+OR+silver+price+OR+copper+price+OR+platinum&hl=en-US&gl=US&ceid=US:en"
    source_class: rss
    lead_class: LAGGING
    trust: aggregator
    phase_prior: mixed
    max_age_hours: 72
    keyless: true
    layers: [3]
    enabled: true

  google_news_energy:
    url: "https://news.google.com/rss/search?q=oil+price+OR+crude+oil+OR+OPEC+OR+natural+gas&hl=en-US&gl=US&ceid=US:en"
    source_class: rss
    lead_class: LAGGING
    trust: aggregator
    phase_prior: mixed
    max_age_hours: 72
    keyless: true
    layers: [4]
    enabled: true

  google_news_equities:
    url: "https://news.google.com/rss/search?q=Nvidia+OR+Tesla+OR+MicroStrategy+OR+Coinbase+stock+earnings&hl=en-US&gl=US&ceid=US:en"
    source_class: rss
    lead_class: LAGGING
    trust: aggregator
    phase_prior: mixed
    max_age_hours: 72
    keyless: true
    layers: [5]
    enabled: true

  sec_edgar:         {source_class: api, lead_class: LEADING,    trust: official, phase_prior: realized, keyless: true,  layers: [5],    enabled: true}    # 8-K/S-1/424B — официально, до новостного цикла
  btc_eth_tactical:  {source_class: api, lead_class: LEADING,    trust: primary,  phase_prior: realized, keyless: true,  layers: [1],    enabled: true}    # OKX public funding/OI/liquidation regime
  okx_announcements: {source_class: api, lead_class: LEADING,    trust: official, phase_prior: mixed,    keyless: true,  layers: [1, 2], enabled: false}   # official OKX announcements; day-test can enable via env
  okx_market_tape:   {source_class: api, lead_class: COINCIDENT, trust: primary,  phase_prior: realized, keyless: true,  layers: [1, 2, 3, 4, 5], enabled: false}  # public OKX market movers for missed-move audit
  dexscreener:       {source_class: api, lead_class: COINCIDENT, trust: primary,  phase_prior: realized, keyless: true,  layers: [2],    enabled: true}
  goplus_rugcheck:   {source_class: api, lead_class: LEADING,    trust: primary,  phase_prior: realized, keyless: true,  layers: [2],    enabled: true}   # red-flag VETO
  oilprice:          {url: "https://oilprice.com/rss/main",      source_class: rss, lead_class: LAGGING, trust: wire,     phase_prior: mixed,    max_age_hours: 96, keyless: true,  layers: [4],    enabled: true}
  gdelt:             {source_class: api, lead_class: LAGGING,    trust: aggregator, phase_prior: realized, keyless: true, layers: [3, 4], enabled: false}   # металлы/геополитика, медленный recall
  telegram_alpha:    {source_class: telegram, lead_class: LEADING, trust: tg_alpha, phase_prior: mixed,  keyless: false, layers: [1, 2], enabled: false}   # Telethon, нужен api_id трейдера

  # ── Telegram public web fallback (без API/Telethon): https://t.me/s/<channel> ──
  # Включены как отдельные source_id, чтобы source_quality_report видел качество каждого канала.
  tg_new_listings_feed:
    url: "https://t.me/s/NewListingsFeed"
    channel: "NewListingsFeed"
    source_class: telegram_web
    telegram_kind: listing
    lead_class: LEADING
    trust: tg_alpha
    phase_prior: realized
    max_age_hours: 120
    keyless: true
    layers: [1, 2]
    enabled: true
    onboarding_status: candidate
    expected_body: telegram_text
    quality_notes: "листинги бирж; один Telegram-пост может дать несколько ticker-events через event_key"
    rate_limit_notes: "1 public web GET/проход, без логина и Telegram API"

  tg_markettwits:
    url: "https://t.me/s/markettwits"
    channel: "markettwits"
    source_class: telegram_web
    telegram_kind: news
    lead_class: LEADING
    trust: tg_alpha
    phase_prior: mixed
    max_age_hours: 24
    keyless: true
    layers: [1, 2, 4, 5]
    enabled: true
    onboarding_status: candidate
    expected_body: telegram_text
    quality_notes: "быстрые RU market headlines; нужен строгий дедуп и source-quality замер"
    rate_limit_notes: "1 public web GET/проход, без логина и Telegram API"

  tg_hyperliquid_liquidations:
    url: "https://t.me/s/HyperliquidLiquidations"
    channel: "HyperliquidLiquidations"
    source_class: telegram_web
    telegram_kind: liquidations
    lead_class: COINCIDENT
    trust: tg_alpha
    phase_prior: realized
    max_age_hours: 24
    keyless: true
    layers: [1, 2, 4]
    enabled: true
    onboarding_status: candidate
    expected_body: telegram_text
    quality_notes: "ликвидации = context/flow, не самостоятельный GO; полезно для сквиз-риска"
    rate_limit_notes: "1 public web GET/проход, без логина и Telegram API"

  # ── ОНБОРДИНГ 11.06.2026 — эксперимент «ровно один источник на слой» ───────
  # Замер 24-48ч → scripts/analysis/source_onboarding_report.py → keep/disable.
  etf_flow:              # L1: дневные потоки спот-ETF (КОНТЕКСТ market_ctx, не карточки)
    source_class: context          # не RSS-карточки: только строка фона для L1-кандидатов
    lead_class: COINCIDENT
    trust: manual
    phase_prior: realized
    keyless: true
    layers: [1]
    enabled: false                 # включить = enabled:true + вести data/scout/etf_flows.csv
    provider: manual_csv
    onboarding_status: needs_provider
    expected_body: manual_csv
    quality_notes: "слот под ежедневный CSV трейдера (date,ticker,asset,flow_usd_m,source); живой web-провайдер — после GO"
    rate_limit_notes: "локальный файл, сети нет"

  investing_commodities:           # L3: прямая commodities-лента (металлы; уход от google-обёрток)
    url: "https://www.investing.com/rss/commodities.rss"
    source_class: rss
    lead_class: LAGGING
    trust: wire
    phase_prior: mixed
    max_age_hours: 48
    keyless: true
    layers: [3]
    enabled: false                 # disabled: 100% title_only (22/22, avg 58 chars); investing.com JS-rendered, trafilatura не берёт
    onboarding_status: disabled
    expected_body: direct_body
    quality_notes: "2026-06-12: 100% title_only (22 docs, 0 full body); investing.com uses JS rendering that trafilatura cannot handle. Re-enable only with headless browser or API adapter."
    rate_limit_notes: "1 GET/проход (30 мин); RSS отвечал 200 под сканерным UA 11.06"

  rigzone:                         # L4: прямая нефтегаз-лента (дополняет oilprice)
    url: "https://www.rigzone.com/news/rss/rigzone_latest.aspx"
    source_class: rss
    lead_class: LAGGING
    trust: wire
    phase_prior: mixed
    max_age_hours: 48
    keyless: true
    layers: [4]
    enabled: false                 # disabled: 100% title_only (25/25, avg 45 chars); rigzone JS-rendered
    onboarding_status: disabled
    expected_body: direct_body
    quality_notes: "2026-06-12: 100% title_only (25 docs, 0 full body); rigzone.com requires JS rendering or dedicated parser. Re-enable only with headless browser or RSS adapter."
    rate_limit_notes: "1 GET/проход; RSS 200/20 items под сканерным UA 11.06"

  globenewswire_public:            # L5: официальные пресс-релизы публичных компаний (IR-класс)
    url: "https://www.globenewswire.com/RssFeed/orgclass/1/feedTitle/GlobeNewswire%20-%20News%20about%20Public%20Companies"
    source_class: rss
    lead_class: LAGGING
    trust: primary
    phase_prior: realized
    max_age_hours: 48
    keyless: true
    layers: [5]
    enabled: true
    onboarding_status: candidate
    expected_body: direct_body
    quality_notes: "первичка (company PR до пересказов); объём большой — роутер режет не-трекаемое ДО LLM (drops=дёшево); дополняет sec_edgar, не дублирует (PR≠филинг)"
    rate_limit_notes: "1 GET/проход; RSS 200/20 items 11.06"

  # ── БУДЕТ (expected — КАЛЕНДАРИ) → наполняют pending_events (surprise-эдж) ─
  fred_calendar:     {source_class: api, lead_class: LEADING,    trust: official, phase_prior: expected, keyless: false, layers: [1, 3], enabled: true}    # FOMC/CPI/jobs — free-key FRED
  eia:               {source_class: web, lead_class: LEADING,    trust: official, phase_prior: expected, keyless: true,  layers: [4],    enabled: true}    # WPSR next release date from official EIA page
  opec:              {source_class: web, lead_class: LEADING,    trust: official, phase_prior: expected, keyless: true,  layers: [4],    enabled: true}    # next OPEC/OPEC+ meeting from official press releases
  earnings_calendar: {source_class: api, lead_class: LEADING,    trust: official, phase_prior: expected, keyless: true,  layers: [5],    enabled: true}    # даты отчётов из SEC-linked company announcements
  token_unlocks:     {source_class: api, lead_class: LEADING,    trust: primary,  phase_prior: expected, keyless: false, layers: [2],    enabled: true,
                      onboarding_status: needs_key, expected_body: api,
                      quality_notes: "кандидат L2 онбординга 11.06: без TOKENOMIST_API_KEY молчит честно (не фейкуем); dexscreener flow_metrics уже live как L2-улучшение",
                      rate_limit_notes: "до 3 страниц API/проход при наличии ключа"}    # Tokenomist API key required
