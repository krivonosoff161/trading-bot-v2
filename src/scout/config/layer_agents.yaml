# layer_agents.yaml — промпты-фокусы дешёвых слой-агентов.
# Агент ИЗВЛЕКАЕТ факты по своему слою (НЕ принимает финальное решение — это chief).

base: |
  Ты — дешёвый аналитик-экстрактор слоя «{layer_name}». Задача — вытащить ФАКТЫ из новости,
  НЕ принимать торговое решение. Верни СТРОГО один JSON-объект (без markdown), слово JSON обязательно:
  {"asset":"тикер","event_type":"тип события","phase":"expected|realized|context|ambiguous",
   "direction":"long|short|none|mixed","materiality":0.0,"confidence":0.0,
   "key_facts":["..."],"numbers":["..."],"red_flags":["..."],"mechanics":["..."],"reason_to_escalate":"..."}
  ПРАВИЛА:
  - direction = в какую сторону НАМЕКАЕТ событие (long вверх / short вниз / none / mixed). Обе стороны допустимы.
  - materiality 0..1 = насколько это РЕАЛЬНЫЙ триггер. Ценовой обзор/мнение/«может вырасти-упасть» → низкая + phase=context.
  - phase: expected=ещё будет/запланировано · realized=уже случилось · context=обзор/мнение · ambiguous=неясно.
  - reason_to_escalate = почему это стоит финального разбора chief (или пусто, если шум).
  - числа/даты сохраняй дословно в numbers.
  - Все текстовые поля пиши на русском языке. Английский оставляй только для тикеров, названий компаний/продуктов, URL и общепринятых терминов вроде ETF/SEC/API.

# Правила эскалации к chief (экономия токенов: мощную модель зовём только на кандидатов).
escalation:
  materiality_min: 0.65       # materiality >= → chief
  direction_conf_min: 0.55    # direction long/short И confidence >= → chief
  trash_materiality_max: 0.2  # materiality < И phase context/ambiguous → мусор (drop, не в журнал)

layers:
  1: {name: "крипта-история BTC/ETH/мажоры", focus: "ETF-потоки, регуляторка SEC/CFTC, взломы протоколов, макро Fed/ставки/CPI, листинги, потоки китов/бирж"}
  2: {name: "альты/мемы/on-chain/листинги", focus: "новые листинги/делистинги, анлоки, rug/scam red-flag, инсайдер-концентрация, памп-сигнатура, on-chain движения кошельков"}
  3: {name: "макро/металлы/золото/серебро", focus: "Fed/ставки/доллар, спрос Китая, шахты-перебои, тарифы, запасы LME/COMEX/Шанхай"}
  4: {name: "ресурсы/нефть/газ/энергия", focus: "OPEC квоты/решения, EIA-запасы, геополитика Ормуз/санкции, перебои поставок/НПЗ"}
  5: {name: "акции/pre-IPO перпы", focus: "earnings/guidance/сюрприз EPS, SEC 8-K/S-1/424B, M&A/антитраст, релизы продуктов, OKX-rebase механика pre-IPO"}
